name: Plugin version

on:
  pull_request:

permissions:
  contents: read

jobs:
  version-bump:
    name: Plugin version bump
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require a version bump when the plugin changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          plugin_dir="plugins/vail-agent-assurance"
          manifest="$plugin_dir/.claude-plugin/plugin.json"

          changed="$(git diff --name-only "$BASE_SHA" HEAD -- "$plugin_dir")"
          if [ -z "$changed" ]; then
            echo "No changes under $plugin_dir."
            exit 0
          fi

          echo "Plugin files changed:"
          printf '%s\n' "$changed"

          version_at() {
            local rev="$1"
            if ! git cat-file -e "${rev}:${manifest}" 2>/dev/null; then
              printf ''
              return 0
            fi
            git show "${rev}:${manifest}" | python3 -c 'import json, sys; value = json.load(sys.stdin).get("version"); print("" if value is None else value)'
          }

          base_version="$(version_at "$BASE_SHA")"
          head_version="$(version_at HEAD)"

          echo "Base version: ${base_version:-<none>}"
          echo "Pull request version: ${head_version:-<none>}"

          if [ -z "$head_version" ]; then
            echo "plugin.json declares no version, so Claude Code tracks commits instead of this string."
            exit 0
          fi

          if [ "$base_version" = "$head_version" ]; then
            echo "::error file=${manifest},title=Version was not bumped::Plugin files changed but version is still '${head_version}'. Bump version in ${manifest} so existing installs pick up this change."
            exit 1
          fi

          echo "Version changed from '${base_version:-<none>}' to '${head_version}'."
